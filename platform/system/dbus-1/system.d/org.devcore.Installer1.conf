<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.devcore.Installer1"/>
  </policy>
  <policy group="devcore-live">
    <allow send_destination="org.devcore.Installer1"/>
  </policy>
  <policy context="default">
    <deny send_destination="org.devcore.Installer1"/>
  </policy>
</busconfig>
