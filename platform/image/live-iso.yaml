# This is image-builder's canonical ISO configuration. The native installer
# supports x86-64 UEFI only; the build script rejects other builder hosts.
label: DEVCOREOS_LIVE
grub2:
  entries:
    - name: Try DevCore OS
      # The live root is ephemeral; permissive SELinux lets systemd relabel
      # firmware/VM device nodes during initialization. Installed targets keep
      # their normal enforcing policy.
      linux: /images/pxeboot/vmlinuz root=live:CDLABEL=DEVCOREOS_LIVE rd.live.image rd.live.overlay.overlayfs=1 systemd.unit=graphical.target devcore.live=1 devcore.installer=manual enforcing=0 console=ttyS0 console=tty0
      initrd: /images/pxeboot/initrd.img
    - name: Install DevCore OS
      linux: /images/pxeboot/vmlinuz root=live:CDLABEL=DEVCOREOS_LIVE rd.live.image rd.live.overlay.overlayfs=1 systemd.unit=graphical.target devcore.live=1 devcore.installer=auto enforcing=0 console=ttyS0 console=tty0
      initrd: /images/pxeboot/initrd.img
