# This is image-builder's canonical ISO configuration. The native installer
# supports x86-64 UEFI only; the build script rejects other builder hosts.
label: DEVCOREOS_LIVE
grub2:
  entries:
    # 1. Standard Live mode: ephemeral root with enforcing SELinux (production-like)
    - name: Try DevCore OS
      linux: /images/pxeboot/vmlinuz root=live:CDLABEL=DEVCOREOS_LIVE rd.live.image rd.live.overlay.overlayfs=1 systemd.unit=graphical.target devcore.live=1 devcore.installer=manual console=ttyS0 console=tty0
      initrd: /images/pxeboot/initrd.img
    # 2. Automated installer mode: enforcing SELinux, skips try-session
    - name: Install DevCore OS
      linux: /images/pxeboot/vmlinuz root=live:CDLABEL=DEVCOREOS_LIVE rd.live.image rd.live.overlay.overlayfs=1 systemd.unit=graphical.target devcore.live=1 devcore.installer=auto console=ttyS0 console=tty0
      initrd: /images/pxeboot/initrd.img
