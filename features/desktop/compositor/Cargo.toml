[package]
name = "devcore-compositor"
description = "DevCore's minimal Smithay Wayland compositor boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
native-drm = [
    "dep:smithay-drm-extras",
    "smithay/backend_drm",
    "smithay/backend_egl",
    "smithay/backend_gbm",
    "smithay/backend_libinput",
    "smithay/backend_session_libseat",
    "smithay/backend_udev",
    "smithay/renderer_multi",
]

[dependencies]
smithay = { version = "=0.7.0", default-features = false, features = [
    "backend_winit",
    "desktop",
    "renderer_gl",
    "wayland_frontend",
] }
smithay-drm-extras = { version = "=0.1.0", default-features = false, optional = true }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.20", features = ["env-filter"] }
wayland-protocols = { version = "=0.32.13", features = [
    "server",
    "staging",
    "unstable",
] }
wayland-server = "=0.31.14"
winit = { version = "=0.30.13", default-features = false, features = [
    "wayland",
    "wayland-dlopen",
    "x11",
    "rwh_06",
] }

[lints]
workspace = true
