<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.devcore.FirstBoot1"/>
  </policy>
  <policy user="devcore">
    <allow send_destination="org.devcore.FirstBoot1"
           send_interface="org.devcore.FirstBoot1"/>
  </policy>
</busconfig>
